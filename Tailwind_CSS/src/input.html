<!doctype html>
<html class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
</head>

<body class="min-h-screen bg-black text-white flex items-center justify-center">

    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl p-8 shadow-2xl">

        <h1 class="text-3xl font-bold text-center mb-8">
            Login
        </h1>

        <form class="space-y-5">

            <div>
                <label for="email" class="block text-sm font-medium text-zinc-300 mb-2">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg
                           text-white placeholder-zinc-500
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-transparent"
                />
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-zinc-300 mb-2">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    placeholder="Enter your password"
                    class="w-full px-4 py-3 bg-zinc-800 border border-zinc-700 rounded-lg
                           text-white placeholder-zinc-500
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-transparent"
                />
            </div>

            <button
                type="submit"
                class="w-full py-3 bg-blue-600 hover:bg-blue-700
                       text-white font-semibold rounded-lg
                       transition duration-200"
            >
                Login
            </button>

        </form>

    </div>

</body>
</html>
