<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            outline: 2px solid black;
            grid-template-areas:
            "box1 box2 box2"
            "box1 box3 box3"
            "box4 box5 box6";
            gap: 5px;
            width: 600px;
            margin: 50px auto;
        }
        .container>div{
            font-size: 30px;
            outline: 1px dashed rgb(11, 2, 2); 
            
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        #box1{
            background-color: white;
            grid-column-start:1;
            grid-column-end: 3;
            grid-row-start: 1;
            grid-row-end: 3;
            z-index: 1;
        }#box6{
            background-color: grey;
            grid-column-start:2;
            grid-column-end: 3;
            grid-row-start: 2;
            grid-row-end: 3;
            z-index: 2;
        }
        </style>
</head>
<body>
    <div class="container">
        <div id="box1"><img src="./1.jpg">
        </div>
        <div id="box2"><img src="./2.jpg">
        </div>
        <div id="box3"><img src="./3.jpg">
        </div>
        <div id="box4"><img src="./4.jpg">
        </div>
        <div id="box5"><img src="./5.jpg">
        </div>
        <div id="box6"><img src="./6.jpg">
        </div>
    </div>
</body>
</html>
