<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            outline: 2px solid black;
            grid-template-areas:
            "box1 box2 box2"
            "box1 box3 box3"
            "box4 box5 box6";
            gap: 5px;
            width: 600px;
            margin: 50px auto;
        }
        .container>div{
            font-size: 30px;
            /* outline: 1px dashed rgb(11, 2, 2); */
            border: 2px solid black;
            border-radius: 8px;
            overflow: hidden;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        </style>
</head>
<body>
    <div class="container">
        <div style="grid-area: box1"><img src="./1.jpg">
        </div>
        <div style="grid-area: box2"><img src="./2.jpg">
        </div>
        <div style="grid-area: box3"><img src="./3.jpg">
        </div>
        <div style="grid-area: box4"><img src="./4.jpg">
        </div>
        <div style="grid-area: box5"><img src="./5.jpg">
        </div>
        <div style="grid-area: box6"><img src="./6.jpg">
        </div>
    </div>
</body>
</html>
